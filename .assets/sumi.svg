<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FCFBF8"/>
      <stop offset="1" stop-color="#F1EFE9"/>
    </linearGradient>
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- macOS squircle tile (824pt inside 1024pt canvas, corner radius ~22.5%) -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)" filter="url(#tileShadow)"/>

  <!-- Glyph: bookshelf, soft near-black -->
  <g fill="#1C1C1E">
    <!-- baseline -->
    <rect x="242" y="704" width="520" height="14" rx="7"/>
    <!-- book 1 -->
    <rect x="276" y="376" width="90" height="328" rx="12"/>
    <!-- book 2 (tallest) -->
    <rect x="386" y="310" width="96" height="394" rx="12"/>
    <!-- book 3 (leaning, pulled out) -->
    <rect x="502" y="318" width="84" height="386" rx="12"
          transform="translate(0 704) skewX(-10) translate(0 -704)"/>
    <!-- book 4 (shortest) -->
    <rect x="668" y="440" width="90" height="264" rx="12"/>
  </g>
</svg>
