[package]
name = "sumi-daemon"
version = "0.1.0"
edition = "2021"
authors = ["soryu-ryouji <helloryouji@outlook.com>"]
description = "sumi 书籍管理后端"
license = "AGPL-3.0-only"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "catch-panic"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.22"
blake3 = "1"
clap = { version = "4", features = ["derive", "env"] }
rusqlite = { version = "0.32", features = ["bundled"] }
notify = "8"
image = "0.25"
fast_image_resize = { version = "5", features = ["image"] }
mime_guess = "2"
base64 = "0.22"
url = "2"
getrandom = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"
argon2 = "0.5"
webp = { version = "0.3", default-features = false }
filetime = "0.2"
percent-encoding = "2"
ureq = { version = "3", default-features = false, features = ["rustls"] }
async-stream = "0.3"
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-axum = "0.2"
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.37"
chardetng = "0.1"
encoding_rs = "0.8"
mobi = "0.8"
ab_glyph = "0.2"
pdfium-render = { version = "0.9.4", features = ["thread_safe"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
